name: Release

on:
  push:
    tags:
      - "v*.*.*"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and attach binaries to (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  resolve-tag:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - id: resolve
        run: |
          tag="${{ github.event.release.tag_name || github.event.inputs.tag || github.ref_name }}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  build:
    needs: resolve-tag
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-tag.outputs.tag }}
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: backend/go.sum

      - name: Build binaries
        working-directory: backend
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          mkdir -p dist
          ext=""
          if [ "$GOOS" = "windows" ]; then ext=".exe"; fi
          for bin in api controller worker spider; do
            name="spider-${bin}"
            if [ "$bin" = "spider" ]; then name="spider"; fi
            go build -trimpath -ldflags "-s -w" -o "dist/${name}${ext}" "./cmd/${bin}"
          done

      - name: Package archive
        working-directory: backend/dist
        run: |
          set -euo pipefail
          archive="spider_${{ matrix.goos }}_${{ matrix.goarch }}"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            zip -q "${archive}.zip" *
            echo "asset_path=backend/dist/${archive}.zip" >> "$GITHUB_ENV"
          else
            tar -czf "${archive}.tar.gz" *
            echo "asset_path=backend/dist/${archive}.tar.gz" >> "$GITHUB_ENV"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: spider_${{ matrix.goos }}_${{ matrix.goarch }}
          path: ${{ env.asset_path }}
          if-no-files-found: error

  release:
    needs: [resolve-tag, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten and checksum
        working-directory: artifacts
        run: |
          set -euo pipefail
          find . -mindepth 2 -type f -exec mv {} . \;
          find . -mindepth 1 -type d -empty -delete
          sha256sum * > SHA256SUMS.txt

      - name: Publish or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.resolve-tag.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "release $TAG already exists — uploading/replacing assets"
            gh release upload "$TAG" artifacts/* --repo "${{ github.repository }}" --clobber
          else
            gh release create "$TAG" artifacts/* \
              --repo "${{ github.repository }}" \
              --title "$TAG" \
              --generate-notes
          fi
