apiVersion: apps/v1
kind: Deployment
metadata:
  name: spider-api
  labels:
    app: spider
    component: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: spider
      component: api
  template:
    metadata:
      labels:
        app: spider
        component: api
    spec:
      containers:
        - name: api
          image: spider-api:0.1.0
          command: ["/app/spider-api"]
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              value: postgres://spider:spider@postgres:5432/spider?sslmode=disable
            - name: SPIDER_FAIL_MODE
              value: closed
            - name: SPIDER_DEFAULT_DETECTOR
              value: prompt-shield
            - name: SPIDER_PROMPT_SHIELD_ENDPOINT
              value: http://prompt-shield:8081
            - name: SPIDER_PROMPT_SHIELD_MODEL
              value: robbypambudi/prompt-shield-flan-t5-small
---
apiVersion: v1
kind: Service
metadata:
  name: spider-api
spec:
  selector:
    app: spider
    component: api
  ports:
    - port: 8000
      targetPort: 8000
