[project]
name = "spider"
version = "0.1.0"
description = "SPIDER: A Runtime Defense Framework for Prompt Injection Detection in LLM-Serving Cluster Environments"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "SPIDER Contributors" }]
keywords = [
  "prompt-injection",
  "llm-security",
  "runtime-defense",
  "llm-serving",
]
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30.0",
  "alembic>=1.14.0",
  "redis>=5.2.0",
  "httpx>=0.27.0",
  "typer>=0.14.0",
  "pyjwt>=2.10.0",
  "prometheus-client>=0.21.0",
  "structlog>=24.4.0",
  "orjson>=3.10.0",
  "python-multipart>=0.0.17",
  "greenlet>=3.1.0",
  "psutil>=6.1.0",
  "nvidia-ml-py>=12.560.0",
  "email-validator>=2.2.0",
  "pyyaml>=6.0.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.8.0",
  "mypy>=1.13.0",
  "aiosqlite>=0.20.0",
  "httpx>=0.27.0",
  "types-psutil>=6.1.0",
]

[project.scripts]
spider = "cmd.cli.main:app"
spider-worker = "cmd.worker.main:cli_app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cmd", "internal", "pkg", "dao"]

[tool.uv]
package = true

[dependency-groups]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.8.0",
  "mypy>=1.13.0",
  "aiosqlite>=0.20.0",
  "types-psutil>=6.1.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["cmd", "internal", "pkg", "dao", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
  "fastapi.Depends",
  "fastapi.Query",
  "fastapi.Path",
  "fastapi.Header",
  "fastapi.params.Depends",
  "fastapi.params.Header",
]

[tool.ruff.lint.per-file-ignores]
"dao/migrations/*" = ["E402"]
"tests/*" = ["B018"]

[tool.mypy]
python_version = "3.12"
pretty = true
show_error_codes = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = false
disallow_untyped_defs = true
check_untyped_defs = true
ignore_missing_imports = true
exclude = ["dao/migrations", "tests"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]
# `cmd/` is the process-entrypoint package (Go-style). It shadows stdlib `cmd`,
# which pytest's debugging plugin imports via pdb. Disable that plugin.
addopts = "-p no:debugging"
filterwarnings = [
  "ignore::DeprecationWarning",
]
