experiment:
  name: baseline-low-fpr

dataset:
  path: experiments/datasets/test.jsonl

security:
  detector: prompt-shield
  prompt_shield_endpoint: http://localhost:8081
  prompt_shield_model: robbypambudi/prompt-shield-flan-t5-small
  chunker:
    type: token
    size: 256
    overlap: 0
  threshold: 0.5
  policy:
    action_on_detection: block

metrics:
  target_fpr:
    - 0.0005
    - 0.001
    - 0.005
    - 0.01
